<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一眼カメラ 等価露出計算ツール (Equivalent Exposure Calculator)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            camera: {
              900: '#121316',
              850: '#181a1f',
              800: '#20242b',
              700: '#2d323c',
              600: '#3f4553',
              accent: '#ff6b00',
              amber: '#f59e0b',
              display: '#0f172a',
              led: '#38bdf8'
            }
          },
          fontFamily: {
            mono: ['JetBrains Mono', 'Menlo', 'Consolas', 'monospace'],
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif']
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #181a1f;
    }
    ::-webkit-scrollbar-thumb {
      background: #3f4553;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff6b00;
    }
    .dial-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body class="bg-camera-900 text-slate-200 min-h-screen font-sans antialiased selection:bg-camera-accent selection:text-white pb-12">

        <div class="w-8 h-8 rounded-lg bg-camera-accent flex items-center justify-center text-white font-bold text-sm shadow-md">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>

        </div>
      </div>
      <div class="text-right">
        <span class="text-xs font-mono text-slate-400">基準光量 (ISO100換算): </span>
        <span id="evBadge" class="text-xs font-mono font-bold text-camera-led">13.0 EV</span>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 py-6 space-y-6">

    <!-- Comparison Panels: Input (Left) vs Output (Right) -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

      <!-- INPUT PANEL: Current Settings -->
      <section class="bg-camera-850 border border-camera-700 rounded-2xl p-5 sm:p-6 shadow-xl space-y-5">
        <div class="flex items-center justify-between border-b border-camera-700/80 pb-3">
          <div class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-full bg-orange-500"></span>
            <h2 class="text-base font-bold text-white tracking-wide">現在の設定 (入力)</h2>
          </div>
          <button id="resetBaseBtn" class="text-xs text-slate-400 hover:text-white px-2.5 py-1 bg-camera-800 hover:bg-camera-700 border border-camera-700 rounded transition">
            初期値に戻す
          </button>
        </div>

        <!-- 1. Aperture -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-baseline">
            <label class="text-xs font-mono font-medium text-slate-300">絞り (F値)</label>
            <span id="baseApertureVal" class="text-sm font-bold font-mono text-amber-400">f/8.0</span>
          </div>
          <div class="flex items-center gap-2">
            <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="baseAperture" data-delta="-1">◀ 開放</button>
            <input type="range" id="baseApertureSlider" min="0" max="33" value="18" class="w-full accent-amber-500 cursor-pointer">
            <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="baseAperture" data-delta="1">絞る ▶</button>
          </div>
        </div>

        <!-- 2. Shutter Speed -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-baseline">
            <label class="text-xs font-mono font-medium text-slate-300">シャッタースピード</label>
            <span id="baseShutterVal" class="text-sm font-bold font-mono text-camera-led">1/125 秒</span>
          </div>
          <div class="flex items-center gap-2">
            <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="baseShutter" data-delta="-1">◀ 高速</button>
            <input type="range" id="baseShutterSlider" min="0" max="54" value="18" class="w-full accent-sky-400 cursor-pointer">
            <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="baseShutter" data-delta="1">長秒 ▶</button>
          </div>
        </div>

        <!-- 3. ISO -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-baseline">
            <label class="text-xs font-mono font-medium text-slate-300">ISO 感度</label>
            <span id="baseISOVal" class="text-sm font-bold font-mono text-emerald-400">ISO 100</span>
          </div>
          <div class="flex items-center gap-2">
            <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="baseISO" data-delta="-1">◀ 低感度</button>
            <input type="range" id="baseISOSlider" min="0" max="31" value="3" class="w-full accent-emerald-500 cursor-pointer">
            <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="baseISO" data-delta="1">高感度 ▶</button>

        <!-- 4. ND Filter -->
        <div class="space-y-1.5 pt-2 border-t border-camera-700/50">
          <div class="flex justify-between items-baseline">
            <label class="text-xs font-mono font-medium text-slate-300">ND フィルター</label>
            <span id="baseNDVal" class="text-xs font-mono text-slate-400">なし (0 EV)</span>
          </div>
          <select id="baseNDSelect" class="w-full bg-camera-800 border border-camera-700 rounded-lg px-3 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-camera-accent cursor-pointer">
            <option value="0">なし (0 EV)</option>
            <option value="1">ND2 (1段減光 / -1 EV)</option>
            <option value="2">ND4 (2段減光 / -2 EV)</option>
            <option value="3">ND8 (3段減光 / -3 EV)</option>
            <option value="4">ND16 (4段減光 / -4 EV)</option>
            <option value="5">ND32 (5段減光 / -5 EV)</option>
            <option value="6">ND64 (6段減光 / -6 EV)</option>
            <option value="9">ND500 (9段減光 / -9 EV)</option>
            <option value="10">ND1000 (10段減光 / -10 EV)</option>
            <option value="15">ND32000 (15段減光)</option>
          </select>
        </div>
      </section>

      <!-- OUTPUT PANEL: Target Equivalent Settings -->
      <section class="bg-camera-850 border border-camera-700 rounded-2xl p-5 sm:p-6 shadow-xl space-y-5 flex flex-col justify-between">
        <div class="space-y-5">
          <div class="flex items-center justify-between border-b border-camera-700/80 pb-3">
            <div class="flex items-center gap-2">
              <span class="w-2.5 h-2.5 rounded-full bg-camera-led"></span>
              <h2 class="text-base font-bold text-white tracking-wide">同じ明るさの設定 (出力)</h2>
            </div>
            <button id="copySummaryBtn" class="text-xs text-slate-300 hover:text-white px-2.5 py-1 bg-camera-800 hover:bg-camera-700 border border-camera-700 rounded transition flex items-center gap-1.5">
              <span>設定をコピー</span>
            </button>
          </div>

          <!-- Calculation Target Mode Selector -->
          <div class="space-y-2">
            <label class="text-xs font-medium text-slate-400 block">自動計算する項目を選択:</label>
            <div class="grid grid-cols-3 gap-2 text-xs font-mono">
              <button class="solver-btn py-2 px-2 rounded-lg border border-camera-accent bg-camera-accent/20 text-orange-400 text-center font-bold transition" data-solve="shutter">
                SS を計算
              </button>
              <button class="solver-btn py-2 px-2 rounded-lg border border-transparent bg-camera-800 text-slate-400 hover:text-white text-center transition" data-solve="aperture">
                F値 を計算
              </button>
              <button class="solver-btn py-2 px-2 rounded-lg border border-transparent bg-camera-800 text-slate-400 hover:text-white text-center transition" data-solve="iso">
                ISO を計算
              </button>
            </div>
          </div>

          <!-- Target Controls -->
          <div class="space-y-4">
            <!-- Target Aperture -->
            <div id="targetApertureGroup" class="space-y-1.5 transition">
              <div class="flex justify-between items-baseline">
                <span class="text-xs font-mono text-slate-300 flex items-center gap-1.5">
                  絞り (F値)
                  <span id="targetApertureAutoBadge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-mono">CALC</span>
                </span>
                <span id="targetApertureVal" class="text-sm font-bold font-mono text-amber-400">f/8.0</span>
              </div>
              <div class="flex items-center gap-2">
                <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="targetAperture" data-delta="-1">◀</button>
                <input type="range" id="targetApertureSlider" min="0" max="33" value="18" class="w-full accent-amber-500 cursor-pointer">
                <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="targetAperture" data-delta="1">▶</button>
              </div>
            </div>

            <!-- Target Shutter -->
            <div id="targetShutterGroup" class="space-y-1.5 transition opacity-60 pointer-events-none">
              <div class="flex justify-between items-baseline">
                <span class="text-xs font-mono text-slate-300 flex items-center gap-1.5">
                  シャッタースピード
                  <span id="targetShutterAutoBadge" class="text-[10px] px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 font-mono">CALC</span>
                </span>
                <span id="targetShutterVal" class="text-sm font-bold font-mono text-camera-led">1/125 秒</span>
              </div>
              <div class="flex items-center gap-2">
                <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="targetShutter" data-delta="-1">◀</button>
                <input type="range" id="targetShutterSlider" min="0" max="54" value="18" class="w-full accent-sky-400 cursor-pointer">
                <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="targetShutter" data-delta="1">▶</button>
              </div>
            </div>

            <!-- Target ISO -->
            <div id="targetISOGroup" class="space-y-1.5 transition">
              <div class="flex justify-between items-baseline">
                <span class="text-xs font-mono text-slate-300 flex items-center gap-1.5">
                  ISO 感度
                  <span id="targetISOAutoBadge" class="hidden text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/20 text-emerald-300 font-mono">CALC</span>
                </span>
                <span id="targetISOVal" class="text-sm font-bold font-mono text-emerald-400">ISO 100</span>
              </div>
              <div class="flex items-center gap-2">
                <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="targetISO" data-delta="-1">◀</button>
                <input type="range" id="targetISOSlider" min="0" max="31" value="3" class="w-full accent-emerald-500 cursor-pointer">
                <button class="step-btn dial-btn px-2.5 py-1 bg-camera-800 hover:bg-camera-700 text-slate-300 rounded text-xs font-mono" data-target="targetISO" data-delta="1">▶</button>
              </div>
            </div>

            <!-- Target ND -->
            <div class="space-y-1.5 pt-2 border-t border-camera-700/50">
              <div class="flex justify-between items-baseline">
                <span class="text-xs font-mono text-slate-300">ND フィルター</span>
                <span id="targetNDVal" class="text-xs font-mono text-slate-400">なし (0 EV)</span>
              </div>
              <select id="targetNDSelect" class="w-full bg-camera-800 border border-camera-700 rounded-lg px-3 py-2 text-xs font-mono text-slate-200 focus:outline-none focus:border-camera-accent cursor-pointer">
                <option value="0">なし (0 EV)</option>
                <option value="1">ND2 (1段減光 / -1 EV)</option>
                <option value="2">ND4 (2段減光 / -2 EV)</option>
                <option value="3">ND8 (3段減光 / -3 EV)</option>
                <option value="4">ND16 (4段減光 / -4 EV)</option>
                <option value="5">ND32 (5段減光 / -5 EV)</option>
                <option value="6">ND64 (6段減光 / -6 EV)</option>
                <option value="9">ND500 (9段減光 / -9 EV)</option>
                <option value="10">ND1000 (10段減光 / -10 EV)</option>
                <option value="15">ND32000 (15段減光)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Shift breakdown summary -->
        <div class="p-3 bg-camera-900 rounded-xl border border-camera-700/70 text-xs font-mono">
          <div class="flex items-center justify-between text-slate-400 mb-2">
            <span>露出維持ステータス:</span>
            <span id="diffTotalStatus" class="text-emerald-400 font-bold">±0.0 EV (等価露出)</span>
          </div>
          <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-[11px] text-slate-300 border-t border-camera-800 pt-2">
            <div>F値: <span id="diffAperture" class="text-amber-400">±0 段</span></div>
            <div>SS: <span id="diffShutter" class="text-camera-led">±0 段</span></div>
            <div>ISO: <span id="diffISO" class="text-emerald-400">±0 段</span></div>
            <div>ND: <span id="diffND" class="text-slate-400">±0 段</span></div>
          </div>
        </div>
      </section>

    </div>
  </main>

  <!-- Notification Toast -->
  <div id="toast" class="fixed bottom-5 right-5 bg-camera-800 border border-camera-600 text-white text-xs px-4 py-3 rounded-xl shadow-2xl transition-all duration-300 transform translate-y-20 opacity-0 pointer-events-none z-50 flex items-center gap-2 font-mono">
    <span id="toastIcon">📋</span>
    <span id="toastMsg">クリップボードにコピーしました</span>
  </div>

  <script>
    /* Standard 1/3-stop steps tables */
    const APERTURE_STOPS = [
      1.0, 1.1, 1.2, 1.4, 1.6, 1.8, 2.0, 2.2, 2.5, 2.8, 3.2, 3.5, 4.0, 4.5, 5.0, 
      5.6, 6.3, 7.1, 8.0, 9.0, 10.0, 11.0, 13.0, 14.0, 16.0, 18.0, 20.0, 22.0, 
      25.0, 29.0, 32.0, 36.0, 40.0, 45.0
    ];

    const SHUTTER_STOPS = [
      { val: 1/8000, label: "1/8000" },
      { val: 1/6400, label: "1/6400" },
      { val: 1/5000, label: "1/5000" },
      { val: 1/4000, label: "1/4000" },
      { val: 1/3200, label: "1/3200" },
      { val: 1/2500, label: "1/2500" },
      { val: 1/2000, label: "1/2000" },
      { val: 1/1600, label: "1/1600" },
      { val: 1/1250, label: "1/1250" },
      { val: 1/1000, label: "1/1000" },
      { val: 1/800,  label: "1/800" },
      { val: 1/640,  label: "1/640" },
      { val: 1/500,  label: "1/500" },
      { val: 1/400,  label: "1/400" },
      { val: 1/320,  label: "1/320" },
      { val: 1/250,  label: "1/250" },
      { val: 1/200,  label: "1/200" },
      { val: 1/160,  label: "1/160" },
      { val: 1/125,  label: "1/125" },
      { val: 1/100,  label: "1/100" },
      { val: 1/80,   label: "1/80" },
      { val: 1/60,   label: "1/60" },
      { val: 1/50,   label: "1/50" },
      { val: 1/40,   label: "1/40" },
      { val: 1/30,   label: "1/30" },
      { val: 1/25,   label: "1/25" },
      { val: 1/20,   label: "1/20" },
      { val: 1/15,   label: "1/15" },
      { val: 1/13,   label: "1/13" },
      { val: 1/10,   label: "1/10" },
      { val: 1/8,    label: "1/8" },
      { val: 1/6,    label: "1/6" },
      { val: 1/5,    label: "1/5" },
      { val: 1/4,    label: "1/4" },
      { val: 0.3,    label: "0.3\"" },
      { val: 0.4,    label: "0.4\"" },
      { val: 0.5,    label: "0.5\"" },
      { val: 0.6,    label: "0.6\"" },
      { val: 0.8,    label: "0.8\"" },
      { val: 1.0,    label: "1\"" },
      { val: 1.3,    label: "1.3\"" },
      { val: 1.6,    label: "1.6\"" },
      { val: 2.0,    label: "2\"" },
      { val: 2.5,    label: "2.5\"" },
      { val: 3.2,    label: "3.2\"" },
      { val: 4.0,    label: "4\"" },
      { val: 5.0,    label: "5\"" },
      { val: 6.0,    label: "6\"" },
      { val: 8.0,    label: "8\"" },
      { val: 10.0,   label: "10\"" },
      { val: 13.0,   label: "13\"" },
      { val: 15.0,   label: "15\"" },
      { val: 20.0,   label: "20\"" },
      { val: 25.0,   label: "25\"" },
      { val: 30.0,   label: "30\"" }
    ];

    const ISO_STOPS = [
      50, 64, 80, 100, 125, 160, 200, 250, 320, 400, 500, 640, 800, 1000, 
      1250, 1600, 2000, 2500, 3200, 4000, 5000, 6400, 8000, 10000, 12800, 
      16000, 20000, 25600, 32000, 51200, 64000, 102400
    ];

    const state = {
      base: {
        apertureIdx: 18, // f/8.0
        shutterIdx: 18,  // 1/125
        isoIdx: 3,       // ISO 100
        ndStops: 0
      },
      target: {
        apertureIdx: 18,
        shutterIdx: 18,
        isoIdx: 3,
        ndStops: 0
      },
      solveMode: 'shutter' // 'shutter' | 'aperture' | 'iso'
    };

    function calculateEV100(fNumber, shutterSec) {
      return Math.log2((fNumber * fNumber) / shutterSec);
    }

    function calculateTotalLightEV(fNumber, shutterSec, isoVal, ndStops = 0) {
      const ev100 = calculateEV100(fNumber, shutterSec);
      const isoEV = Math.log2(isoVal / 100);
      return ev100 - isoEV + ndStops;
    }

    function findNearestIndex(array, targetVal, getValFn) {
      let bestIdx = 0;
      let minDiff = Infinity;
      for (let i = 0; i < array.length; i++) {
        const val = getValFn ? getValFn(array[i]) : array[i];
        const diff = Math.abs(val - targetVal);
        if (diff < minDiff) {
          minDiff = diff;
          bestIdx = i;
        }
      }
      return bestIdx;
    }

    function solveTargetExposure() {
      const baseF = APERTURE_STOPS[state.base.apertureIdx];
      const baseT = SHUTTER_STOPS[state.base.shutterIdx].val;
      const baseISO = ISO_STOPS[state.base.isoIdx];
      const baseND = state.base.ndStops;

      const targetEV = calculateTotalLightEV(baseF, baseT, baseISO, baseND);

      if (state.solveMode === 'shutter') {
        const targetF = APERTURE_STOPS[state.target.apertureIdx];
        const targetISO = ISO_STOPS[state.target.isoIdx];
        const targetND = state.target.ndStops;
        
        const exponent = targetEV + Math.log2(targetISO / 100) - targetND;
        const requiredT = (targetF * targetF) / Math.pow(2, exponent);
        state.target.shutterIdx = findNearestIndex(SHUTTER_STOPS, requiredT, item => item.val);

      } else if (state.solveMode === 'aperture') {
        const targetT = SHUTTER_STOPS[state.target.shutterIdx].val;
        const targetISO = ISO_STOPS[state.target.isoIdx];
        const targetND = state.target.ndStops;

        const exponent = targetEV + Math.log2(targetISO / 100) - targetND;
        const requiredN2 = targetT * Math.pow(2, exponent);
        const requiredN = Math.sqrt(Math.max(0.2, requiredN2));
        state.target.apertureIdx = findNearestIndex(APERTURE_STOPS, requiredN);

      } else if (state.solveMode === 'iso') {
        const targetF = APERTURE_STOPS[state.target.apertureIdx];
        const targetT = SHUTTER_STOPS[state.target.shutterIdx].val;
        const targetND = state.target.ndStops;

        const evAt100 = calculateEV100(targetF, targetT);
        const exponent = evAt100 + targetND - targetEV;
        const requiredISO = 100 * Math.pow(2, exponent);
        state.target.isoIdx = findNearestIndex(ISO_STOPS, requiredISO);
      }
    }

    function updateUI() {
      // 1. Base values
      const baseF = APERTURE_STOPS[state.base.apertureIdx];
      const baseT = SHUTTER_STOPS[state.base.shutterIdx];
      const baseISO = ISO_STOPS[state.base.isoIdx];
      const baseND = state.base.ndStops;

      document.getElementById('baseApertureSlider').value = state.base.apertureIdx;
      document.getElementById('baseApertureVal').innerText = `f/${baseF.toFixed(1)}`;

      document.getElementById('baseShutterSlider').value = state.base.shutterIdx;
      document.getElementById('baseShutterVal').innerText = `${baseT.label} 秒`;

      document.getElementById('baseISOSlider').value = state.base.isoIdx;
      document.getElementById('baseISOVal').innerText = `ISO ${baseISO}`;

      document.getElementById('baseNDSelect').value = baseND;
      document.getElementById('baseNDVal').innerText = baseND === 0 ? "なし (0 EV)" : `${baseND} 段減光`;

      // 2. Target values
      const targetF = APERTURE_STOPS[state.target.apertureIdx];
      const targetT = SHUTTER_STOPS[state.target.shutterIdx];
      const targetISO = ISO_STOPS[state.target.isoIdx];
      const targetND = state.target.ndStops;

      document.getElementById('targetApertureSlider').value = state.target.apertureIdx;
      document.getElementById('targetApertureVal').innerText = `f/${targetF.toFixed(1)}`;

      document.getElementById('targetShutterSlider').value = state.target.shutterIdx;
      document.getElementById('targetShutterVal').innerText = `${targetT.label} 秒`;

      document.getElementById('targetISOSlider').value = state.target.isoIdx;
      document.getElementById('targetISOVal').innerText = `ISO ${targetISO}`;

      document.getElementById('targetNDSelect').value = targetND;
      document.getElementById('targetNDVal').innerText = targetND === 0 ? "なし (0 EV)" : `${targetND} 段減光`;

      // 3. EV Badge
      const ev100 = calculateEV100(baseF, baseT.val);
      document.getElementById('evBadge').innerText = `${ev100.toFixed(1)} EV`;

      // 4. Stop breakdown
      const stopDiffF = (Math.log2(targetF) - Math.log2(baseF)) * 2;
      const stopDiffT = Math.log2(baseT.val / targetT.val);
      const stopDiffISO = Math.log2(targetISO / baseISO);
      const stopDiffND = targetND - baseND;

      function formatStop(val) {
        if (Math.abs(val) < 0.08) return "±0 段";
        const sign = val > 0 ? "+" : "";
        return `${sign}${val.toFixed(1)} 段`;
      }

      document.getElementById('diffAperture').innerText = formatStop(-stopDiffF);
      document.getElementById('diffShutter').innerText = formatStop(-stopDiffT);
      document.getElementById('diffISO').innerText = formatStop(stopDiffISO);
      document.getElementById('diffND').innerText = formatStop(-stopDiffND);

      const totalBaseEV = calculateTotalLightEV(baseF, baseT.val, baseISO, baseND);
      const totalTargetEV = calculateTotalLightEV(targetF, targetT.val, targetISO, targetND);
      const diffEV = totalTargetEV - totalBaseEV;

      const diffStatus = document.getElementById('diffTotalStatus');
      if (Math.abs(diffEV) < 0.15) {
        diffStatus.innerText = "±0.0 EV (等価露出)";
        diffStatus.className = "text-emerald-400 font-bold";
      } else {
        const sign = diffEV > 0 ? "+" : "";
        diffStatus.innerText = `${sign}${diffEV.toFixed(1)} EV (${diffEV > 0 ? "光量不足" : "光量過多"})`;
        diffStatus.className = "text-amber-400 font-bold";
      }

      updateSolverUI();
    }

    function updateSolverUI() {
      const modes = ['shutter', 'aperture', 'iso'];
      modes.forEach(mode => {
        const btn = document.querySelector(`.solver-btn[data-solve="${mode}"]`);
        const group = document.getElementById(`target${mode.charAt(0).toUpperCase() + mode.slice(1)}Group`);
        const autoBadge = document.getElementById(`target${mode.charAt(0).toUpperCase() + mode.slice(1)}AutoBadge`);

        if (state.solveMode === mode) {
          btn.className = "solver-btn py-2 px-2 rounded-lg border border-camera-accent bg-camera-accent/20 text-orange-400 text-center font-bold transition";
          group.classList.add('opacity-70', 'pointer-events-none');
          if (autoBadge) autoBadge.classList.remove('hidden');
        } else {
          btn.className = "solver-btn py-2 px-2 rounded-lg border border-transparent bg-camera-800 text-slate-400 hover:text-white text-center transition";
          group.classList.remove('opacity-70', 'pointer-events-none');
          if (autoBadge) autoBadge.classList.add('hidden');
        }
      });
    }

    function showToast(msg, icon = "✅") {
      const toast = document.getElementById('toast');
      document.getElementById('toastMsg').innerText = msg;
      document.getElementById('toastIcon').innerText = icon;
      toast.classList.remove('opacity-0', 'translate-y-20');
      toast.classList.add('opacity-100', 'translate-y-0');
      clearTimeout(window._toastTimeout);
      window._toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-20');
        toast.classList.remove('opacity-100', 'translate-y-0');
      }, 2000);
    }

    function initListeners() {
      // Base Inputs
      document.getElementById('baseApertureSlider').addEventListener('input', (e) => {
        state.base.apertureIdx = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      document.getElementById('baseShutterSlider').addEventListener('input', (e) => {
        state.base.shutterIdx = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      document.getElementById('baseISOSlider').addEventListener('input', (e) => {
        state.base.isoIdx = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      document.getElementById('baseNDSelect').addEventListener('change', (e) => {
        state.base.ndStops = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      // Target Inputs
      document.getElementById('targetApertureSlider').addEventListener('input', (e) => {
        state.target.apertureIdx = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      document.getElementById('targetShutterSlider').addEventListener('input', (e) => {
        state.target.shutterIdx = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      document.getElementById('targetISOSlider').addEventListener('input', (e) => {
        state.target.isoIdx = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      document.getElementById('targetNDSelect').addEventListener('change', (e) => {
        state.target.ndStops = parseInt(e.target.value);
        solveTargetExposure();
        updateUI();
      });

      // Stepper delta buttons (◀ ▶)
      document.querySelectorAll('.step-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const targetKey = btn.dataset.target;
          const delta = parseInt(btn.dataset.delta);

          if (targetKey === 'baseAperture') {
            state.base.apertureIdx = Math.max(0, Math.min(APERTURE_STOPS.length - 1, state.base.apertureIdx + delta));
          } else if (targetKey === 'baseShutter') {
            state.base.shutterIdx = Math.max(0, Math.min(SHUTTER_STOPS.length - 1, state.base.shutterIdx + delta));
          } else if (targetKey === 'baseISO') {
            state.base.isoIdx = Math.max(0, Math.min(ISO_STOPS.length - 1, state.base.isoIdx + delta));
          } else if (targetKey === 'targetAperture') {
            state.target.apertureIdx = Math.max(0, Math.min(APERTURE_STOPS.length - 1, state.target.apertureIdx + delta));
          } else if (targetKey === 'targetShutter') {
            state.target.shutterIdx = Math.max(0, Math.min(SHUTTER_STOPS.length - 1, state.target.shutterIdx + delta));
          } else if (targetKey === 'targetISO') {
            state.target.isoIdx = Math.max(0, Math.min(ISO_STOPS.length - 1, state.target.isoIdx + delta));
          }

          solveTargetExposure();
          updateUI();
        });
      });

      // Solver Mode Selector
      document.querySelectorAll('.solver-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          state.solveMode = btn.dataset.solve;
          solveTargetExposure();
          updateUI();
        });
      });

      // Reset
      document.getElementById('resetBaseBtn').addEventListener('click', () => {
        state.base = { apertureIdx: 18, shutterIdx: 18, isoIdx: 3, ndStops: 0 };
        state.target = { ...state.base };
        solveTargetExposure();
        updateUI();
        showToast("設定を初期値 (f/8, 1/125s, ISO 100) に戻しました");
      });

      // Copy text summary
      document.getElementById('copySummaryBtn').addEventListener('click', () => {
        const baseF = APERTURE_STOPS[state.base.apertureIdx];
        const baseT = SHUTTER_STOPS[state.base.shutterIdx].label;
        const baseISO = ISO_STOPS[state.base.isoIdx];
        const baseND = state.base.ndStops;

        const targetF = APERTURE_STOPS[state.target.apertureIdx];
        const targetT = SHUTTER_STOPS[state.target.shutterIdx].label;
        const targetISO = ISO_STOPS[state.target.isoIdx];
        const targetND = state.target.ndStops;

        const text = [
          `【一眼カメラ等価露出設定】`,
          `・現在の設定: f/${baseF.toFixed(1)}, ${baseT}s, ISO ${baseISO}${baseND > 0 ? `, ND${Math.pow(2, baseND)}` : ''}`,
          `・同じ明るさの設定: f/${targetF.toFixed(1)}, ${targetT}s, ISO ${targetISO}${targetND > 0 ? `, ND${Math.pow(2, targetND)}` : ''}`,
          `・基準EV: ${document.getElementById('evBadge').innerText}`
        ].join('\n');

        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = text;
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        try {
          document.execCommand('copy');
          showToast("設定をコピーしました！");
        } catch (err) {
          showToast("コピーに失敗しました", "⚠️");
        }
        document.body.removeChild(tempTextarea);
      });
    }

    window.addEventListener('load', () => {
      initListeners();
      solveTargetExposure();
      updateUI();
    });
  </script>
</body>
</html>
